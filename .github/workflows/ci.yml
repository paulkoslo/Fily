# Simple CI pipeline:
# on each push/PR, verify the project installs, builds, and tests.
name: CI

on:
  # Run checks for code pushed directly and for pull requests.
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  # If you push multiple times quickly, cancel older runs for the same branch.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      # Download repository code into the runner.
      - name: Checkout
        uses: actions/checkout@v4

      # Match the documented development runtime and single workspace lockfile.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install exact dependency versions from package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Reject high and critical dependency advisories
        run: npm audit --audit-level=high

      - name: Verify native SQLite in the app runtime
        run: npm run doctor

      # Includes UI, core, desktop and mandatory SQLite regression tests.
      - name: Run CI checks
        run: npm run ci:check

      - name: Smoke test built renderer, preload and IPC in an isolated profile
        if: runner.os == 'macOS'
        run: npm run smoke:desktop && npm run smoke:dev
